<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Identicon Creator</title>
  <meta name="description" content="文字列から GitHub 風などの identicon を生成。ブラウザだけで動作します。">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 10 10'%3E%3Cpath d='M1 1h2v2H1zM7 1h2v2H7zM3 3h4v2H3zM1 5h2v4H1zM7 5h2v4H7z' fill='%23238636'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <h1>Identicon Creator</h1>
      <p>文字列を入れると、同じ文字列からはいつも同じアイコンができます。</p>
    </header>

    <section class="panel controls">
      <label class="field">
        <span>文字列</span>
        <div class="row">
          <input id="seed" type="text" autocomplete="off" spellcheck="false" placeholder="何か入力…">
          <button id="random" type="button">ランダム</button>
        </div>
      </label>

      <div class="options">
        <label class="field"><span>形</span>
          <select id="shape">
            <option value="square">四角</option>
            <option value="rounded">角丸</option>
            <option value="circle">円</option>
          </select>
        </label>
        <label class="field"><span>背景</span>
          <select id="bg">
            <option value="auto">スタイル既定</option>
            <option value="transparent">透明</option>
            <option value="white">白</option>
            <option value="dark">ダーク</option>
          </select>
        </label>
        <label class="field"><span>書き出しサイズ</span>
          <select id="size">
            <option value="128">128px</option>
            <option value="256">256px</option>
            <option value="512" selected>512px</option>
            <option value="1024">1024px</option>
          </select>
        </label>
        <div class="field"><span>色</span>
          <div class="row color">
            <label class="check"><input id="useColor" type="checkbox"> 固定</label>
            <input id="color" type="color" value="#2da44e" disabled>
          </div>
        </div>
      </div>
    </section>

    <section class="panel preview">
      <div id="preview" class="big" aria-live="polite"></div>
      <div class="about">
        <strong id="styleName"></strong>
        <p id="styleDesc"></p>
        <p class="note">各スタイルは雰囲気を再現した自作実装で、本家の出力とは一致しません。</p>
      </div>
      <div class="actions">
        <button id="dlSvg" type="button">SVG 保存</button>
        <button id="dlPng" type="button">PNG 保存</button>
        <button id="dlGif" type="button" hidden>GIF 保存</button>
        <button id="copySvg" type="button">SVG をコピー</button>
        <button id="share" type="button">URL をコピー</button>
      </div>
      <p id="status" class="status" role="status"></p>
    </section>

    <section>
      <h2>スタイル一覧</h2>
      <div id="gallery" class="gallery"></div>
    </section>

    <section>
      <div class="row head">
        <h2>10連ランダム</h2>
        <button id="roll" type="button">もう一度引く</button>
      </div>
      <p class="hint">現在のスタイルと設定で10個並べます。気に入ったものをクリックすると採用されます。</p>
      <div id="batch" class="gallery batch"></div>
    </section>

    <footer>
      <p>すべてブラウザ内で生成され、入力した文字列は送信されません。</p>
    </footer>
  </main>
  <script type="module" src="js/app.js"></script>
</body>
</html>
